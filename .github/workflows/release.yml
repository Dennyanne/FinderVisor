name: Release

# Pushing a tag like v0.1 builds FinderVisor on a macOS runner, runs the unit tests,
# and publishes FinderVisor-<version>.zip as a GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version

      - name: Unit tests
        run: make test

      - name: Build (ad-hoc signed)
        run: make build

      - name: Check version matches tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PLIST="build/Build/Products/Release/FinderVisor.app/Contents/Info.plist"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")
          echo "tag=$VERSION app=$APP_VERSION"
          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $APP_VERSION in Config/Base.xcconfig"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/FinderVisor.app "FinderVisor-$VERSION.zip"
          shasum -a 256 "FinderVisor-$VERSION.zip" > "FinderVisor-$VERSION.zip.sha256"
          cat "FinderVisor-$VERSION.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "FinderVisor-$VERSION.zip" "FinderVisor-$VERSION.zip.sha256" \
            --title "FinderVisor $VERSION" \
            --notes-file .github/release-notes.md
